<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câmbio Argentina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna estreita, de cima para baixo — cotações do dia, conversor, histórico */
:root{
  --bg:#e8f1ff; --surface:#ffffff; --fg:#000000; --muted:#26313b; --line:#7d93ab;
  --accent:#0052e0; --accent-soft:#cfe0ff; --on-strong:#ffffff;
  --good:#00843a; --good-soft:#00a347; --warn:#c25e00; --warn-soft:#ffd84d;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05101c; --surface:#0f1f30; --fg:#ffffff; --muted:#c9d6e3; --line:#3f5872;
  --accent:#4da3ff; --accent-soft:#12345a; --on-strong:#00140a; --good:#3dff8f; --good-soft:#1fd16a;
  --warn:#ffb020; --warn-soft:#ffd84d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05101c; --surface:#0f1f30; --fg:#ffffff; --muted:#c9d6e3; --line:#3f5872;
  --accent:#4da3ff; --accent-soft:#12345a; --on-strong:#00140a; --good:#3dff8f; --good-soft:#1fd16a;
  --warn:#ffb020; --warn-soft:#ffd84d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header h1{font-family:var(--f-display);font-size:1.5rem;margin:0;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
section{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-display);font-size:1rem;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.8rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.fields{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
label span.hint{font-weight:400;text-transform:none;letter-spacing:0;font-size:.78rem}
input{font-family:var(--f-num);font-size:1.15rem;font-weight:500;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input::placeholder{color:var(--muted);opacity:.7}
.note{font-size:.82rem;color:var(--muted);margin:0}
.saved{color:var(--good);font-weight:600}
button{font:700 .95rem var(--f-body);border-radius:8px;padding:11px 16px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:#fff}
button.ghost{background:transparent;color:var(--accent)}
button.del{background:transparent;border:none;color:var(--muted);padding:4px 8px;font-size:.85rem}
button.del:hover{color:var(--warn)}
.banner{background:var(--warn-soft);border-color:var(--warn);color:#000}
.banner p{margin:0}
.banner .note,.banner strong{color:#000}
.banner .vals{font-family:var(--f-num);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:8px}
.big input{font-size:1.4rem;padding:12px 14px}
.result{display:flex;flex-direction:column;gap:10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:2px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.opt .k{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.opt .v{font-family:var(--f-num);font-size:1.4rem;font-weight:500}
.opt .s{font-size:.8rem;color:var(--muted)}
.opt.best{border-color:var(--good-soft);background:var(--good-soft);color:var(--on-strong)}
.opt.best .k,.opt.best .s{color:var(--on-strong)}
.opt.off{opacity:.5;border-style:dashed}
.verdict{font-weight:700;font-size:1.05rem;padding:12px 14px;border-radius:8px;background:var(--accent-soft);color:var(--fg)}
.verdict.good{background:var(--good-soft);color:var(--on-strong);font-size:1.15rem}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.dash{color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--good-soft);color:var(--on-strong)}
.pill.none{background:var(--accent-soft);color:var(--fg)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:5px}
.tabs a{text-align:center;font-weight:700;padding:10px 8px;border-radius:8px;text-decoration:none;color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--accent);color:#fff}
.tabs a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:18px}
.casa h3{font-family:var(--f-display);font-size:1.1rem;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.contact{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem}
.contact a{color:var(--accent);font-weight:600}
.contact .tel{user-select:all;font-family:var(--f-num)}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:460px){.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
button.sm{padding:8px 12px;font-size:.88rem}
button:disabled{opacity:.4;cursor:not-allowed}
.best-list{display:flex;flex-direction:column;gap:8px}
.best-item{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;border:2px solid var(--line)}
.best-item.top{background:var(--good-soft);border-color:var(--good-soft);color:var(--on-strong)}
.best-item .k{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.best-item .v{font-family:var(--f-num);font-weight:500;font-size:1.1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-weight:600;padding:12px 16px;border-radius:10px;max-width:calc(100% - 32px);z-index:20}
.from{font-size:.8rem;color:var(--accent);font-weight:600;text-transform:none;letter-spacing:0}
.form-casa input{font-family:var(--f-body)}
.err{color:var(--warn);font-weight:600;font-size:.88rem;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Câmbio Argentina</h1>
    <p id="today-label">Base: Real (R$)</p>
  </header>

  <nav class="tabs" aria-label="Seções">
    <a href="#cotacoes" id="tab-main">Cotações</a>
    <a href="#casas" id="tab-casas">Casas de câmbio</a>
  </nav>

  <div class="view" id="view-main">

  <section class="banner" id="banner" hidden>
    <p><strong>Novo dia.</strong> Ainda não há cotação para hoje. A última foi em <span id="b-date"></span>:</p>
    <p class="vals" id="b-vals"></p>
    <div class="row">
      <button id="b-keep" type="button">Manter estas cotações</button>
      <button id="b-new" type="button" class="ghost">Apagar e digitar novas</button>
    </div>
  </section>

  <section>
    <h2>Cotações de hoje <small id="save-status"></small></h2>
    <div class="fields">
      <label for="q-brl">Pesos por R$ 1<span class="hint">pagando em reais</span><span class="from" id="from-brl"></span>
        <input id="q-brl" inputmode="decimal" autocomplete="off" placeholder="ex.: 260">
      </label>
      <label for="q-usd">Pesos por US$ 1<span class="hint">pagando em dólar</span><span class="from" id="from-usd"></span>
        <input id="q-usd" inputmode="decimal" autocomplete="off" placeholder="ex.: 1.400">
      </label>
      <label for="q-cost">R$ por US$ 1<span class="hint">cotação do dólar hoje</span>
        <input id="q-cost" inputmode="decimal" autocomplete="off" placeholder="ex.: 5,80">
      </label>
    </div>
    <p class="note">Campo vazio = você não tem aquela moeda hoje. Salva automaticamente.</p>
  </section>

  <section>
    <h2>Trocar no câmbio</h2>
    <div class="result" id="fx-verdict"></div>
    <label for="fx-amount">Quanto em reais quer trocar? <span class="hint">opcional</span>
      <input id="fx-amount" inputmode="decimal" autocomplete="off" placeholder="ex.: 1.000">
    </label>
    <div class="result" id="fx-sim"></div>
  </section>

  <section>
    <h2>Quanto custa?</h2>
    <label for="amount" class="big">Valor em pesos (ARS)
      <input id="amount" inputmode="decimal" autocomplete="off" placeholder="ex.: 25.000">
    </label>
    <div class="result" id="result"></div>
  </section>

  <section>
    <h2>Histórico <small id="hist-count"></small></h2>
    <div class="tbl" id="hist"></div>
  </section>
  </div>

  <div class="view" id="view-casas" hidden>
    <section>
      <h2>Melhor escolha hoje</h2>
      <div id="casas-best"></div>
    </section>

    <div class="view" id="casas-list"></div>

    <section class="form-casa">
      <h2 id="casa-form-title">Adicionar casa de câmbio</h2>
      <label for="c-nome">Nome
        <input id="c-nome" autocomplete="off" placeholder="ex.: Cambio Florida 500">
      </label>
      <label for="c-tel">Telefone / WhatsApp <span class="hint">opcional</span>
        <input id="c-tel" inputmode="tel" autocomplete="off" placeholder="ex.: +54 9 11 5555-1234">
      </label>
      <label for="c-link">Link do Google Maps <span class="hint">opcional</span>
        <input id="c-link" inputmode="url" autocomplete="off" placeholder="https://maps.app.goo.gl/...">
      </label>
      <p class="err" id="c-err" hidden></p>
      <div class="row">
        <button id="c-save" type="button">Adicionar casa</button>
        <button id="c-cancel" type="button" class="ghost" hidden>Cancelar edição</button>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  var KEY='cambio-ar-historico-v1';
  var $=function(id){return document.getElementById(id)};

  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
  function save(h){try{localStorage.setItem(KEY,JSON.stringify(h));return true}catch(e){return false}}

  function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fmtDate(k){var p=k.split('-');return p[2]+'/'+p[1]+'/'+p[0]}

  // Aceita "1.400", "1400", "5,80", "5.80", "1.400,50"
  function parse(s){
    s=String(s||'').trim().replace(/\s/g,'');
    if(!s)return null;
    if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
    var n=parseFloat(s);
    return isFinite(n)&&n>0?n:null;
  }
  function fmt(n,dec){return n.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
  function brl(n){return 'R$ '+fmt(n,2)}
  function show(n){return n==null?'—':fmt(n,n<100?2:0)}

  var hist=load();
  var today=todayKey();
  var inputs={brl:$('q-brl'),usd:$('q-usd'),cost:$('q-cost')};

  $('today-label').textContent='Hoje, '+fmtDate(today)+' · base: Real (R$)';

  function lastBefore(){
    var keys=Object.keys(hist).filter(function(k){return k<today}).sort();
    return keys.length?keys[keys.length-1]:null;
  }

  function fillForm(e){
    inputs.brl.value=e&&e.brl!=null?show(e.brl):'';
    inputs.usd.value=e&&e.usd!=null?show(e.usd):'';
    inputs.cost.value=e&&e.cost!=null?fmt(e.cost,2):'';
  }

  function storeToday(){
    var old=hist[today]||{};
    var e={brl:parse(inputs.brl.value),usd:parse(inputs.usd.value),cost:parse(inputs.cost.value)};
    if(old.casaBrl&&old.brl===e.brl)e.casaBrl=old.casaBrl;
    if(old.casaUsd&&old.usd===e.usd)e.casaUsd=old.casaUsd;
    hist[today]=e;
    var ok=save(hist);
    $('save-status').innerHTML=ok?'<span class="saved">Salvo</span>':'Não foi possível salvar neste navegador';
    $('banner').hidden=true;
    render();
  }

  // Pesos que R$ 1 rende em cada caminho
  function yields(e){
    return {
      brl: e&&e.brl!=null?e.brl:null,
      usd: e&&e.usd!=null&&e.cost!=null?e.usd/e.cost:null
    };
  }

  function renderResult(){
    var box=$('result');
    var e=hist[today];
    var p=parse($('amount').value);
    if(!e){box.innerHTML='<p class="empty">Informe as cotações de hoje para calcular.</p>';return}
    if(!p){box.innerHTML='<p class="empty">Digite um valor em pesos.</p>';return}

    var viaBrl=e.brl!=null?p/e.brl:null;
    var usdNeeded=e.usd!=null?p/e.usd:null;
    var viaUsd=usdNeeded!=null&&e.cost!=null?usdNeeded*e.cost:null;

    var best=null;
    if(viaBrl!=null&&viaUsd!=null)best=viaBrl<=viaUsd?'brl':'usd';
    else if(viaBrl!=null)best='brl';
    else if(viaUsd!=null)best='usd';

    var html='<div class="opts">';
    html+='<div class="opt'+(best==='brl'?' best':'')+(viaBrl==null?' off':'')+'"><span class="k">Pagando em reais</span>'+
      (viaBrl!=null?'<span class="v">'+brl(viaBrl)+'</span><span class="s">1 real = '+show(e.brl)+' pesos</span>':'<span class="s">Sem reais hoje</span>')+'</div>';
    html+='<div class="opt'+(best==='usd'?' best':'')+(usdNeeded==null?' off':'')+'"><span class="k">Pagando em dólar</span>';
    if(viaUsd!=null)html+='<span class="v">'+brl(viaUsd)+'</span><span class="s">US$ '+fmt(usdNeeded,2)+' · 1 real rende '+show(e.usd/e.cost)+' pesos</span>';
    else if(usdNeeded!=null)html+='<span class="v">US$ '+fmt(usdNeeded,2)+'</span><span class="s">Informe a cotação do dólar em reais para comparar</span>';
    else html+='<span class="s">Sem dólar hoje</span>';
    html+='</div></div>';

    var v;
    if(viaBrl!=null&&viaUsd!=null){
      var diff=Math.abs(viaBrl-viaUsd), hi=Math.max(viaBrl,viaUsd);
      if(diff<0.005)v='<div class="verdict">Tanto faz: os dois saem pelo mesmo valor.</div>';
      else v='<div class="verdict good">Pague em '+(best==='brl'?'reais':'dólar')+'. Economia de '+brl(diff)+' ('+fmt(diff/hi*100,1)+'%).</div>';
    }else if(best==='brl')v='<div class="verdict">Hoje você só tem reais: '+brl(viaBrl)+'.</div>';
    else if(best==='usd')v='<div class="verdict">Hoje você só tem dólar: US$ '+fmt(usdNeeded,2)+' ('+brl(viaUsd)+').</div>';
    else if(usdNeeded!=null)v='<div class="verdict">Hoje você só tem dólar: US$ '+fmt(usdNeeded,2)+'.</div>';
    else v='<div class="verdict">Nenhuma moeda informada para hoje.</div>';
    box.innerHTML=html+v;
  }

  function renderHist(){
    var keys=Object.keys(hist).sort().reverse();
    $('hist-count').textContent=keys.length?keys.length+(keys.length===1?' dia':' dias'):'';
    if(!keys.length){$('hist').innerHTML='<p class="empty">Nenhuma cotação salva ainda. As cotações de cada dia aparecem aqui.</p>';return}
    var h='<table><thead><tr><th>Data</th><th>ARS/R$</th><th>ARS/US$</th><th>R$/US$</th><th>Melhor</th><th></th></tr></thead><tbody>';
    keys.forEach(function(k){
      var e=hist[k], y=yields(e), best;
      if(y.brl!=null&&y.usd!=null)best=y.brl>=y.usd?'Reais':'Dólar';
      else if(y.brl!=null)best='Só reais';
      else if(e.usd!=null)best='Só dólar';
      h+='<tr><td>'+fmtDate(k)+(k===today?' <span class="pill none">hoje</span>':'')+'</td>'+
        '<td class="num'+(e.brl==null?' dash':'')+'">'+show(e.brl)+'</td>'+
        '<td class="num'+(e.usd==null?' dash':'')+'">'+show(e.usd)+'</td>'+
        '<td class="num'+(e.cost==null?' dash':'')+'">'+(e.cost==null?'—':fmt(e.cost,2))+'</td>'+
        '<td>'+(best?'<span class="pill">'+best+'</span>':'<span class="pill none">Nenhuma</span>')+'</td>'+
        '<td><button class="del" type="button" data-k="'+k+'" aria-label="Apagar '+fmtDate(k)+'">Apagar</button></td></tr>';
    });
    $('hist').innerHTML=h+'</tbody></table>';
  }

  function renderFx(){
    var vb=$('fx-verdict'), sb=$('fx-sim');
    var e=hist[today];
    if(!e){vb.innerHTML='<p class="empty">Informe as cotações de hoje para comparar.</p>';sb.innerHTML='';return}
    var y=yields(e);
    var v;
    if(y.brl!=null&&y.usd!=null){
      var implied=e.usd/e.brl;
      var diff=Math.abs(y.brl-y.usd), lo=Math.min(y.brl,y.usd);
      var head=diff/lo<0.0005?'<div class="verdict">Tanto faz: real e dólar rendem o mesmo.</div>':
        '<div class="verdict good">Hoje compensa trocar '+(y.brl>y.usd?'REAIS':'DÓLAR')+': rende '+fmt(diff/lo*100,1)+'% mais pesos.</div>';
      v=head+'<div class="opts">'+
        '<div class="opt'+(y.brl>=y.usd?' best':'')+'"><span class="k">Trocando reais</span><span class="v">'+show(y.brl)+'</span><span class="s">pesos por R$ 1</span></div>'+
        '<div class="opt'+(y.usd>y.brl?' best':'')+'"><span class="k">Trocando dólar</span><span class="v">'+show(y.usd)+'</span><span class="s">pesos por R$ 1 em dólar</span></div></div>'+
        '<p class="note">O câmbio paga o dólar como se valesse R$ '+fmt(implied,2)+'; a cotação do dia é R$ '+fmt(e.cost,2)+'.</p>';
    }else if(y.brl!=null&&e.usd==null)v='<div class="verdict">Hoje você só tem reais: R$ 1 = '+show(e.brl)+' pesos.</div>';
    else if(y.brl==null&&e.usd!=null)v='<div class="verdict">Hoje você só tem dólar: US$ 1 = '+show(e.usd)+' pesos.</div>';
    else if(y.brl!=null)v='<div class="verdict">Informe a cotação do dólar em reais para comparar.</div>';
    else v='<div class="verdict">Nenhuma moeda informada para hoje.</div>';
    vb.innerHTML=v;

    var r=parse($('fx-amount').value);
    if(!r){sb.innerHTML='';return}
    var h='<div class="opts">';
    h+='<div class="opt'+(y.brl!=null&&(y.usd==null||y.brl>=y.usd)?' best':'')+(y.brl==null?' off':'')+'"><span class="k">Trocando '+brl(r)+'</span>'+
      (y.brl!=null?'<span class="v">'+fmt(r*y.brl,0)+' ARS</span>':'<span class="s">Sem reais hoje</span>')+'</div>';
    h+='<div class="opt'+(y.usd!=null&&(y.brl==null||y.usd>y.brl)?' best':'')+(y.usd==null?' off':'')+'"><span class="k">Trocando dólar</span>'+
      (y.usd!=null?'<span class="v">'+fmt(r*y.usd,0)+' ARS</span><span class="s">US$ '+fmt(r/e.cost,2)+' (equivale a '+brl(r)+')</span>':'<span class="s">Sem dólar hoje</span>')+'</div>';
    h+='</div>';
    if(y.brl!=null&&y.usd!=null)h+='<p class="note">Diferença: '+fmt(Math.abs(r*y.brl-r*y.usd),0)+' pesos.</p>';
    sb.innerHTML=h;
  }

  function renderFrom(){
    var e=hist[today]||{};
    $('from-brl').textContent=e.casaBrl?'de '+e.casaBrl:'';
    $('from-usd').textContent=e.casaUsd?'de '+e.casaUsd:'';
  }

  function render(){renderFx();renderResult();renderHist();renderFrom()}

  /* ---------- Casas de câmbio ---------- */
  var CKEY='cambio-ar-casas-v1';
  var casas;
  try{casas=JSON.parse(localStorage.getItem(CKEY))||[]}catch(e){casas=[]}
  function saveCasas(){try{localStorage.setItem(CKEY,JSON.stringify(casas))}catch(e){}}
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var editing=null;

  var toastTimer;
  function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3500)}

  function q(c){return (c.quotes&&c.quotes[today])||{}}
  function lastQ(c){
    var ks=Object.keys(c.quotes||{}).filter(function(k){return k<today}).sort();
    return ks.length?{date:ks[ks.length-1],q:c.quotes[ks[ks.length-1]]}:null;
  }

  function renderBest(){
    var box=$('casas-best');
    var withBrl=casas.filter(function(c){return q(c).brl!=null}).sort(function(a,b){return q(b).brl-q(a).brl});
    var withUsd=casas.filter(function(c){return q(c).usd!=null}).sort(function(a,b){return q(b).usd-q(a).usd});
    if(!withBrl.length&&!withUsd.length){
      box.innerHTML='<p class="empty">'+(casas.length?'Informe a cotação de hoje em pelo menos uma casa.':'Adicione uma casa de câmbio abaixo e informe a cotação do dia.')+'</p>';return}
    var cost=(hist[today]||{}).cost;
    var h='';
    if(withBrl.length&&withUsd.length&&cost){
      var bB=q(withBrl[0]).brl, bU=q(withUsd[0]).usd/cost;
      var winBrl=bB>=bU, lo=Math.min(bB,bU), diff=Math.abs(bB-bU);
      h+='<div class="verdict good">Hoje: troque '+(winBrl?'REAIS em '+esc(withBrl[0].nome):'DÓLAR em '+esc(withUsd[0].nome))+
        (diff/lo<0.0005?'':' (rende '+fmt(diff/lo*100,1)+'% mais pesos)')+'.</div>';
    }else if(withBrl.length&&withUsd.length){
      h+='<p class="note">Informe a cotação do dólar em reais na aba Cotações para comparar real com dólar.</p>';
    }
    h+='<div class="best-list">';
    if(withBrl.length)h+='<div class="best-item top"><span><span class="k">Melhor para reais</span><br>'+esc(withBrl[0].nome)+'</span><span class="v">R$ 1 = '+show(q(withBrl[0]).brl)+' ARS</span></div>';
    if(withUsd.length)h+='<div class="best-item top"><span><span class="k">Melhor para dólar</span><br>'+esc(withUsd[0].nome)+'</span><span class="v">US$ 1 = '+show(q(withUsd[0]).usd)+' ARS</span></div>';
    h+='</div>';
    box.innerHTML=h;
  }

  function renderCasas(){
    var list=$('casas-list');
    var maxB=null,maxU=null;
    casas.forEach(function(c){var x=q(c);if(x.brl!=null&&(maxB==null||x.brl>maxB))maxB=x.brl;if(x.usd!=null&&(maxU==null||x.usd>maxU))maxU=x.usd});
    var order=casas.slice().sort(function(a,b){
      var sa=(q(a).brl===maxB&&maxB!=null)||(q(a).usd===maxU&&maxU!=null)?0:1;
      var sb=(q(b).brl===maxB&&maxB!=null)||(q(b).usd===maxU&&maxU!=null)?0:1;
      return sa-sb||a.nome.localeCompare(b.nome)});
    list.innerHTML=order.map(function(c){
      var x=q(c), lq=lastQ(c), id=c.id;
      var badges='';
      if(x.brl!=null&&x.brl===maxB&&casas.length>1)badges+=' <span class="pill">Melhor p/ reais</span>';
      if(x.usd!=null&&x.usd===maxU&&casas.length>1)badges+=' <span class="pill">Melhor p/ dólar</span>';
      var contact='';
      if(c.tel)contact+='<span>Tel: <span class="tel">'+esc(c.tel)+'</span></span>';
      if(c.link)contact+='<a href="'+esc(c.link)+'" target="_blank" rel="noopener">Abrir no Google Maps</a>';
      return '<section class="casa" data-id="'+id+'">'+
        '<h3>'+esc(c.nome)+badges+'</h3>'+
        (contact?'<div class="contact">'+contact+'</div>':'')+
        '<div class="fields two">'+
          '<label for="cq-brl-'+id+'">Pesos por R$ 1<input id="cq-brl-'+id+'" data-f="brl" inputmode="decimal" autocomplete="off" placeholder="—" value="'+(x.brl!=null?show(x.brl):'')+'"></label>'+
          '<label for="cq-usd-'+id+'">Pesos por US$ 1<input id="cq-usd-'+id+'" data-f="usd" inputmode="decimal" autocomplete="off" placeholder="—" value="'+(x.usd!=null?show(x.usd):'')+'"></label>'+
        '</div>'+
        (lq?'<p class="note">Última cotação ('+fmtDate(lq.date)+'): R$ 1 = '+show(lq.q.brl)+' · US$ 1 = '+show(lq.q.usd)+'</p>':'')+
        '<div class="row">'+
          '<button type="button" class="sm" data-act="trade-brl"'+(x.brl==null?' disabled':'')+'>Troquei reais aqui</button>'+
          '<button type="button" class="sm" data-act="trade-usd"'+(x.usd==null?' disabled':'')+'>Troquei dólar aqui</button>'+
        '</div>'+
        '<div class="row"><button type="button" class="del" data-act="edit">Editar dados</button><button type="button" class="del" data-act="remove">Excluir casa</button></div>'+
      '</section>';
    }).join('');
    renderBest();
  }

  $('casas-list').addEventListener('change',function(ev){
    var inp=ev.target; if(!inp.dataset.f)return;
    var c=casas.find(function(k){return k.id===inp.closest('.casa').dataset.id}); if(!c)return;
    c.quotes=c.quotes||{};
    var cur=c.quotes[today]||{};
    cur[inp.dataset.f]=parse(inp.value);
    if(cur.brl==null&&cur.usd==null)delete c.quotes[today];else c.quotes[today]=cur;
    saveCasas(); renderCasas();
  });

  $('casas-list').addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-act]'); if(!b)return;
    var c=casas.find(function(k){return k.id===b.closest('.casa').dataset.id}); if(!c)return;
    var act=b.dataset.act;
    if(act==='trade-brl'||act==='trade-usd'){
      var f=act==='trade-brl'?'brl':'usd';
      var e=hist[today]||{brl:null,usd:null,cost:null};
      e[f]=q(c)[f];
      e[f==='brl'?'casaBrl':'casaUsd']=c.nome;
      hist[today]=e; save(hist);
      fillForm(e); $('save-status').innerHTML='<span class="saved">Salvo</span>'; $('banner').hidden=true;
      render();
      location.hash='#cotacoes';
      toast((f==='brl'?'Pesos por real':'Pesos por dólar')+' de '+c.nome+' levado para a cotação de hoje.');
    }else if(act==='remove'){
      if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Confirmar exclusão?';
        setTimeout(function(){if(b.isConnected){b.dataset.confirm='';b.textContent='Excluir casa'}},3000);return}
      casas=casas.filter(function(k){return k!==c}); saveCasas(); renderCasas();
    }else if(act==='edit'){
      editing=c.id;
      $('c-nome').value=c.nome;$('c-tel').value=c.tel||'';$('c-link').value=c.link||'';
      $('casa-form-title').textContent='Editar '+c.nome;$('c-save').textContent='Salvar alterações';$('c-cancel').hidden=false;
      $('c-nome').focus();
    }
  });

  function resetForm(){
    editing=null;$('c-nome').value='';$('c-tel').value='';$('c-link').value='';$('c-err').hidden=true;
    $('casa-form-title').textContent='Adicionar casa de câmbio';$('c-save').textContent='Adicionar casa';$('c-cancel').hidden=true;
  }
  $('c-cancel').addEventListener('click',resetForm);
  $('c-save').addEventListener('click',function(){
    var nome=$('c-nome').value.trim(), tel=$('c-tel').value.trim(), link=$('c-link').value.trim();
    var err=$('c-err');
    if(!nome){err.textContent='Digite o nome da casa.';err.hidden=false;$('c-nome').focus();return}
    if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
    if(editing){var c=casas.find(function(k){return k.id===editing});if(c){c.nome=nome;c.tel=tel;c.link=link}}
    else casas.push({id:'c'+Date.now().toString(36),nome:nome,tel:tel,link:link,quotes:{}});
    saveCasas(); var wasEdit=!!editing; resetForm(); renderCasas();
    toast(wasEdit?'Casa atualizada.':'Casa adicionada. Informe a cotação de hoje nela.');
  });

  function route(){
    var casasView=location.hash==='#casas';
    $('view-main').hidden=casasView; $('view-casas').hidden=!casasView;
    $('tab-main').setAttribute('aria-current',casasView?'false':'page');
    $('tab-casas').setAttribute('aria-current',casasView?'page':'false');
    if(casasView)renderCasas();
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);

  $('hist').addEventListener('click',function(ev){
    var b=ev.target.closest('button.del');if(!b)return;
    var k=b.getAttribute('data-k');
    if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Confirmar?';
      setTimeout(function(){if(b.isConnected){b.dataset.confirm='';b.textContent='Apagar'}},3000);return}
    delete hist[k];save(hist);
    if(k===today){fillForm(null);checkBanner()}
    render();
  });

  ['brl','usd','cost'].forEach(function(n){inputs[n].addEventListener('change',storeToday)});
  $('amount').addEventListener('input',renderResult);
  $('fx-amount').addEventListener('input',renderFx);

  function checkBanner(){
    var prev=lastBefore();
    if(hist[today]||!prev){$('banner').hidden=true;return}
    var e=hist[prev];
    $('b-date').textContent=fmtDate(prev);
    $('b-vals').textContent='R$ 1 = '+show(e.brl)+' ARS · US$ 1 = '+show(e.usd)+' ARS · US$ 1 = R$ '+(e.cost==null?'—':fmt(e.cost,2));
    $('banner').hidden=false;
  }

  $('b-keep').addEventListener('click',function(){fillForm(hist[lastBefore()]);storeToday()});
  $('b-new').addEventListener('click',function(){fillForm(null);$('banner').hidden=true;inputs.brl.focus()});

  fillForm(hist[today]);
  if(hist[today])$('save-status').textContent='Salvo';
  checkBanner();
  render();
  route();

  // Se a página ficar aberta e virar o dia, pede a nova cotação
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&todayKey()!==today){location.reload()}
  });
})();
</script>
</body>
</html>
